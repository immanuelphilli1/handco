server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite emits bundled chunks into the fixed assets/ dir, and the source
    # references public files by literal /assets/... paths. Cache them hard.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a client-side route. index.html itself must never
    # be cached, or shoppers keep the previous bundle's entry point.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
